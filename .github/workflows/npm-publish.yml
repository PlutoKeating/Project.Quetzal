# 补发 npm 包：某次发版（release.yml）已经创建了 Release，但发布 npm 包那一步失败时，手动触发它，
# 从那次运行里取出已经构建好的 npm 包（产物 npm-tgz）原样发布，不重新构建。
# 先核对：那次运行属于 release.yml、由这个标签触发、构建的提交就是标签指向的提交，包里的版本号与标签一致。
name: npm-publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发版标签，例如 v1.0.3"
        required: true
      run_id:
        description: "那次 release.yml 运行的编号（gh run list --workflow release.yml）"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read          # 读取另一次运行的产物
      packages: write        # GitHub Packages
      id-token: write        # npm provenance
    steps:
      - name: 核对那次运行与标签
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]] || { echo "::error::标签格式不对：$TAG"; exit 1; }
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::运行编号不对：$RUN_ID"; exit 1; }
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '[.path, .head_branch, .head_sha, .event] | @tsv')
          IFS=$'\t' read -r wf branch sha event <<<"$run"
          tagsha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          echo "运行：$wf $branch $sha $event；标签提交：$tagsha"
          [ "$wf" = ".github/workflows/release.yml" ] && [ "$branch" = "$TAG" ] && [ "$event" = push ] && [ "$sha" = "$tagsha" ] || { echo "::error::那次运行不是由这个标签触发的 release.yml"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null || { echo "::error::这个标签还没有 Release"; exit 1; }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tgz
          path: out-npm
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: 核对包的版本号
        env:
          TAG: ${{ inputs.tag }}
        run: |
          ls out-npm
          f=$(ls ./out-npm/plutokeating-quetzal-*.tgz)
          v=$(tar -xOzf "$f" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
          [ "v$v" = "$TAG" ] || { echo "::error::包的版本 $v 与标签 $TAG 不一致"; exit 1; }
      - name: 发布到 GitHub Packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          printf '@plutokeating:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$GH_TOKEN" > "$RUNNER_TEMP/npmrc-github"
          DIST=latest; case "$TAG" in *-*) DIST=next;; esac
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc-github" npm publish ./out-npm/plutokeating-quetzal-*.tgz --tag "$DIST"
      - name: 发布到 npmjs.com（带 --provenance）
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then echo "没有配置 NPM_TOKEN，跳过 npm 发布"; exit 0; fi
          printf '@plutokeating:registry=https://registry.npmjs.org\n//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/npmrc-npmjs"
          DIST=latest; case "$TAG" in *-*) DIST=next;; esac
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc-npmjs" npm publish ./out-npm/plutokeating-quetzal-*.tgz --access public --provenance --tag "$DIST"
