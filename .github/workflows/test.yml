# 测试：推送到 main 或 feature/* 分支、以及拉取请求里改到运行基座（runtime/）或本文件时，在 Linux 与 Windows（x64、arm64）上跑运行基座的测试。
# 只改官网、文档、控制台、同步服务时不跑：这里只测 runtime/，它也不读仓库里别的目录。
# Windows 上先用 sandbox-runtime 的 windows-install 建好沙箱用户与 WFP 规则（runner 是管理员、UAC 已关），沙箱的真机测试才有意义。
name: test

on:
  push:
    branches: [main, "feature/**"]
    paths: ["runtime/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["runtime/**", ".github/workflows/test.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, node: 22 }
          - { os: windows-latest, node: 24 }
          - { os: windows-11-arm, node: 24 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: runtime
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # Linux：没有沙箱时基座拒绝执行命令；ubuntu-24.04 的 AppArmor 默认禁止非特权用户命名空间，只在这台用完即弃的运行器上放开
      - name: 测试用的命令沙箱（bubblewrap）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -q bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - name: Windows：建好命令沙箱（srt-sandbox 用户与 WFP 规则）
        if: runner.os == 'Windows'
        run: node node_modules/@anthropic-ai/sandbox-runtime/dist/cli.js windows-install
      - name: 测试
        if: runner.os == 'Linux'
        run: npm test
      # Windows：每条沙箱里的命令都要以沙箱用户登录一次（加载它的配置文件），几十个测试进程同时这样做会互相拖慢到超时，所以一个文件一个文件地跑
      - name: 测试（Windows，逐个文件）
        if: runner.os == 'Windows'
        env:
          QUETZAL_TEST_SRT: "1"
        run: node --experimental-strip-types --test --test-concurrency=1 test/*.test.ts
      - name: 构建
        run: npm run build
