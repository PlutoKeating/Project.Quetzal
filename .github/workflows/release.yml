# 发版：推送 v<版本> 标签 → 测试并构建运行基座与 App → 创建 GitHub Release。
# 资产命名（官网下载页按此识别）：
#   quetzal-<版本>-android-arm64.apk     Quetzal App（内置运行基座与 Termux 身体适配器）
#   quetzal-<版本>-linux-x64-console.tar.gz   Linux 桌面版控制台（原生窗口；一键安装脚本在有桌面的机器上自动下载，见 cli/install.sh）
#   quetzal-<版本>-linux-arm64-console.tar.gz（同上，arm64）
#   SHA256SUMS、SHA256SUMS-linux-x64、SHA256SUMS-linux-arm64
# 同时把 cli/ 发布为 npm 包 @plutokeating/quetzal（npx @plutokeating/quetzal 安装到 Linux）：仓库 Secrets 里提供 NPM_TOKEN（Automation 令牌）；缺少则跳过 npm 发布。
# 发布说明：CHANGELOG.md 里「## <版本>」小节（没有则只用 GitHub 自动生成的提交摘要）。
# 依赖的 action 都用 Node 24 运行时的大版本（checkout v7、setup-node v7、setup-java v6、action-gh-release v3），避免弃用警告。
# 正式签名：仓库 Secrets 里提供 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD；
# 缺任一项则退回 debug 签名（与本地无 key.properties 时一致）。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04  # 固定版本，避免 ubuntu-latest 迁移提示；升级时同时核对 Flutter / JDK 兼容性
    steps:
      - uses: actions/checkout@v7

      - name: 校验版本号一致（标签 = runtime/package.json = console/pubspec.yaml = cli/package.json）
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          RT=$(node -p "require('./runtime/package.json').version")
          APP=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' console/pubspec.yaml)
          CLI=$(node -p "require('./cli/package.json').version")
          echo "tag=$TAG runtime=$RT app=$APP cli=$CLI"
          [ "$TAG" = "$RT" ] && [ "$TAG" = "$APP" ] && [ "$TAG" = "$CLI" ] || { echo "版本号不一致"; exit 1; }
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            runtime/package-lock.json
            cli/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - name: 构建运行基座并内置进 App（npm ci + test + build）
        run: console/tool/bundle-runtime.sh

      # cli 的 build 会调用 console/tool/build-web.sh 构建网页控制台（需要上面装好的 Flutter），放进 dist/runtime/web/
      - name: 构建 npm 包 @plutokeating/quetzal（内置运行基座、Linux 适配器与网页控制台）
        working-directory: cli
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
          mkdir -p ../out-npm && npm pack --pack-destination ../out-npm

      # 步骤级 if 里不能引用 secrets 上下文（GitHub 会直接判定工作流文件无效，一个 job 都不跑），
      # 所以先把密钥放进步骤 env，在 shell 里判断是否为空。
      - name: 写入正式签名（有 Secrets 时）
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "没有配置签名 Secrets，退回 debug 签名"; exit 0; fi
          echo "$KS_B64" | base64 -d > console/android/release.keystore
          cat > console/android/key.properties <<EOP
          storeFile=release.keystore
          storePassword=$KS_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOP

      - name: 构建 APK（arm64）
        working-directory: console
        run: |
          flutter pub get
          flutter test
          flutter build apk --release --target-platform android-arm64

      - name: 打包资产
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p out
          cp console/build/app/outputs/flutter-apk/app-release.apk "out/quetzal-$V-android-arm64.apk"
          (cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - name: 提取发布说明（CHANGELOG.md 的对应小节）
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          if [ -f CHANGELOG.md ]; then
            awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > out/NOTES.md
          fi
          [ -s out/NOTES.md ] || : > out/NOTES.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v3
        with:
          name: Quetzal ${{ steps.ver.outputs.version }}
          body_path: out/NOTES.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            out/quetzal-*.apk
            out/SHA256SUMS

      # 两个 registry 各用一份独立的 npm 用户配置：带作用域的包按 @作用域:registry 决定发到哪、用哪条凭据，--registry 参数不改变凭据查找
      - name: 发布到 GitHub Packages（仓库的 Packages 栏目；用 GITHUB_TOKEN，总是执行）
        working-directory: cli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '@plutokeating:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$GH_TOKEN" > "$RUNNER_TEMP/npmrc-github"
          TAG=latest; case "$GITHUB_REF_NAME" in *-*) TAG=next;; esac
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc-github" npm publish ../out-npm/plutokeating-quetzal-*.tgz --tag "$TAG"

      - name: 发布到 npmjs.com（有 NPM_TOKEN 时；令牌须是 Granular Access Token 且允许绕过 2FA）
        working-directory: cli
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then echo "没有配置 NPM_TOKEN，跳过 npm 发布"; exit 0; fi
          printf '@plutokeating:registry=https://registry.npmjs.org\n//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/npmrc-npmjs"
          TAG=latest; case "$GITHUB_REF_NAME" in *-*) TAG=next;; esac
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc-npmjs" npm publish ../out-npm/plutokeating-quetzal-*.tgz --access public --tag "$TAG"

  # Linux 桌面版控制台：x64 与 arm64 各一个，在最老的仍受支持的 Ubuntu 上构建（glibc / GTK 越老，能跑的发行版越多），附加到上面创建的 Release。
  # arm64 运行器上 Flutter 没有预打包的 SDK 下载，改为 git clone 同一版本的标签（Flutter 的 dart-sdk 与引擎工件有 linux-arm64 版）。
  # 龙芯（loongarch64）：Flutter 上游不支持，没有原生控制台；运行基座与网页控制台由安装脚本从 Node 的 unofficial-builds 取 Node 后照常运行。
  linux-console:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Flutter（与 release job 同一版本：x64 用 action，arm64 用 git clone 标签）
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: 桌面构建依赖
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: 构建（console/tool/build-linux.sh → quetzal-<版本>-linux-${{ matrix.arch }}-console.tar.gz）
        run: flutter precache --linux && console/tool/build-linux.sh
      - name: 校验值
        working-directory: console/build
        run: sha256sum quetzal-*-linux-*-console.tar.gz > SHA256SUMS-linux-${{ matrix.arch }} && cat SHA256SUMS-linux-${{ matrix.arch }}
      - name: 附加到 Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            console/build/quetzal-*-linux-*-console.tar.gz
            console/build/SHA256SUMS-linux-${{ matrix.arch }}
