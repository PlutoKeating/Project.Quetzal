# 发版：推送 v<版本> 标签 → 测试并构建运行基座、App、Linux 桌面版控制台与 npm 包 → 汇总校验值并签名 → 创建 GitHub Release → 发布 npm 包。
# 资产命名（官网下载页按此识别）：
#   quetzal-<版本>-android-arm64.apk          Quetzal App（只装一个 App：内置运行基座、安卓身体适配器与运行环境 Node.js / git / openssh / proot）
#   quetzal-<版本>-linux-x64-console.tar.gz   Linux 桌面版控制台（原生窗口；一键安装脚本在有桌面的机器上自动下载，见 cli/install.sh）
#   quetzal-<版本>-linux-arm64-console.tar.gz（同上，arm64）
#   quetzal-android-runtime-<配方哈希>.tar.gz   App 内置运行环境的 jniLibs 与 rootfs（以后的发版按配方哈希核对签名后直接取用，不再重编）
#   quetzal-<版本>-landrun-linux-<x64|arm64>.tar.gz   Landlock 沙箱启动器 landrun（第三方，MIT，附许可证）：bubblewrap 用不了的 Linux 机器上用
#   quetzal-<版本>-windows-<x64|arm64>-setup.exe      Windows 安装包（NSIS，cli/windows/）：内嵌运行基座、Windows 控制台、命令沙箱 srt-win 与
#                                                      Node.js / Git / Python 的官方安装包（cli/windows/deps.lock.json 锁定版本与 SHA-256）；install.ps1 下载它
#   SHA256SUMS       上面每个资产一行 `<sha256>  <文件名>`，外加一行 `commit <提交> <标签>`（这个版本对应的源码提交）
#   SHA256SUMS.sig   SHA256SUMS 的 Ed25519 签名（base64）。公钥写死在 App（console/lib/updater.dart）、一键安装脚本（cli/install.sh）
#                    与 soul-bridge（bridge/src）里，官网文档「发布签名与校验」给出校验方法；私钥只在仓库 Secret RELEASE_SIGNING_KEY（PKCS8 PEM）
# 同时把 cli/ 发布为 npm 包 @plutokeating/quetzal（npx @plutokeating/quetzal 安装到 Linux）：GitHub Packages 总是发布；
# npmjs.com 需要仓库 Secret NPM_TOKEN（Granular Access Token），缺少则跳过，发布带 --provenance（npm 页面显示来源证明）。
# 发布说明：CHANGELOG.md 里「## <版本>」小节，后面接 GitHub 自动生成的提交摘要。
#
# 供应链加固：
# - 所有 uses: 都固定到完整的提交 SHA（注释里是对应的标签；升级时用 gh api repos/<owner>/<repo>/git/ref/tags/<标签> 重新解析），
#   而且只用 GitHub 官方的 actions/*：Flutter 直接 git clone 官方仓库的版本标签并核对提交，发 Release 用运行器自带的 gh。
# - 顶层权限只读，每个 job 只拿自己需要的：创建 Release 的 job 才有 contents: write，发布 npm 包的 job 才有 packages: write，
#   两者都有 id-token: write（构建来源证明 / npm provenance），release job 另有 attestations: write。
# - 构建产物经 upload-artifact / download-artifact 在 job 之间传递：签名与发布的 job 不运行任何构建脚本，只核对、签名、上传。
# - 安卓正式签名的 keystore 只出现在 build-apk job 里，flutter build apk 一结束就删除；标签发版缺签名 Secrets 直接失败（不再退回 debug 签名），
#   并用 apksigner 确认 APK 不是 debug 证书签的。需要的 Secrets：ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD。
# - 不用 actions 缓存（标签发版不读取别的分支写入的缓存）。App 内置运行环境的复用只认签名核对过的 Release 资产，
#   或本仓库发版工作流（v* 标签触发）以往运行里同一配方编好的产物（console/tool/android-runtime/reuse.sh）。
name: release

on:
  push:
    tags: ["v*"]
  # 试跑：手动触发，按给定版本号走完测试、构建、汇总与签名，但不创建 Release、不发布 npm（新改的发版流程先在这里跑通，免得浪费版本号）
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（与 runtime/package.json 等一致，例如 1.0.3）"
        required: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5
  FLUTTER_COMMIT: 6a19cca56475dbfba1478ee68d7bd0c2ef891da1   # 3.47.5 标签对应的提交；升级 Flutter 时一起更新
  # 发版签名公钥（Ed25519 原始 32 字节的 base64url），签名后用它自检，确认 Secret 里的私钥与各处写死的公钥是一对
  RELEASE_PUBKEY: QbWLzC1yhOWroLTHtHiAAvVWq1UtWDiQP--D9wHaLU8

jobs:
  prepare:
    runs-on: ubuntu-24.04  # 固定版本，避免 ubuntu-latest 迁移提示；升级时同时核对 Flutter / JDK 兼容性
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 校验版本号一致（标签 = runtime/package.json = console/pubspec.yaml = cli/package.json）
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then TAG="$INPUT_VERSION"; else TAG="${GITHUB_REF_NAME#v}"; fi
          RT=$(node -p "require('./runtime/package.json').version")
          APP=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' console/pubspec.yaml)
          CLI=$(node -p "require('./cli/package.json').version")
          echo "tag=$TAG runtime=$RT app=$APP cli=$CLI"
          [ "$TAG" = "$RT" ] && [ "$TAG" = "$APP" ] && [ "$TAG" = "$CLI" ] || { echo "版本号不一致"; exit 1; }
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  # npm 包：内置运行基座、Linux 适配器与网页控制台（cli 的 build 会调用 console/tool/build-web.sh，需要 Flutter）
  npm-pack:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Flutter（git clone 官方仓库的版本标签并核对提交）
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          [ "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT" ] || { echo "Flutter $FLUTTER_VERSION 的提交不符"; exit 1; }
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: 构建 npm 包 @plutokeating/quetzal（npm ci + test + build + pack）
        working-directory: cli
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
          mkdir -p ../out-npm && npm pack --pack-destination ../out-npm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tgz
          path: out-npm/plutokeating-quetzal-*.tgz
          if-no-files-found: error

  # App 内置的运行环境：termux-packages 以 App 的前缀从源码重编 Node.js、git、openssh、proot（console/tool/android-runtime/，锁定提交），
  # 拆成 jniLibs 与 rootfs 交给 build-apk。配方（版本锁定与脚本）没变时取用以往编好的同一份（reuse.sh：Release 上签名核对过的资产，
  # 或以往发版运行里同一配方的产物），只有配方变了才从源码编译（几个小时）；无论哪种，打成 quetzal-android-runtime-<配方哈希>.tar.gz
  # 随本次 Release 发布、纳入签名的 SHA256SUMS，供以后的发版取用。
  android-runtime:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    permissions:
      contents: read
      actions: read   # 取用以往发版运行的产物
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: 取用以往编好的同一份运行环境
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}/android-runtime-out
        run: |
          if console/tool/android-runtime/reuse.sh; then echo "hit=1" >> "$GITHUB_OUTPUT"; else echo "hit=0" >> "$GITHUB_OUTPUT"; fi
      - name: 腾出磁盘空间（删掉用不到的预装工具链）
        if: steps.reuse.outputs.hit != '1'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/lib/heroku "$AGENT_TOOLSDIRECTORY/CodeQL"
          sudo docker image prune -af >/dev/null
          df -h /
      - name: 编译运行环境（termux-packages，App 的前缀）
        if: steps.reuse.outputs.hit != '1'
        run: console/tool/android-runtime/build-packages.sh
      - name: 拆成 jniLibs 与 rootfs，打成发布资产
        if: steps.reuse.outputs.hit != '1'
        env:
          OUT: ${{ runner.temp }}/android-runtime-out
          KEY: ${{ steps.reuse.outputs.key }}
        run: |
          console/tool/android-runtime/pack.sh
          mkdir -p "$OUT"
          tar -czf "$OUT/quetzal-android-runtime-$KEY.tar.gz" -C console/android/app/src/main jniLibs assets/runtime-env
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-runtime
          path: |
            console/android/app/src/main/jniLibs/
            console/android/app/src/main/assets/runtime-env/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android-runtime
          path: ${{ runner.temp }}/android-runtime-out/quetzal-android-runtime-*.tar.gz
          if-no-files-found: error

  build-apk:
    needs: [prepare, android-runtime]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - name: Flutter（git clone 官方仓库的版本标签并核对提交）
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          [ "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT" ] || { echo "Flutter $FLUTTER_VERSION 的提交不符"; exit 1; }
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      # 运行基座的测试要真的执行命令，而没有沙箱时基座一律拒绝执行（1.0.4 起）。ubuntu-24.04 的 AppArmor 默认禁止非特权用户命名空间，
      # bubblewrap 用不了：只在这台用完即弃的运行器上装 bubblewrap 并放开这项限制
      - name: 测试用的命令沙箱（bubblewrap）
        run: |
          sudo apt-get install -y -q bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev --proc /proc true && echo "bubblewrap 可用"

      - name: 构建运行基座并内置进 App（npm ci + test + build）
        run: console/tool/bundle-runtime.sh

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-runtime
          path: console/android/app/src/main/
      - name: 核对内置运行环境
        run: |
          ls console/android/app/src/main/jniLibs/arm64-v8a/libnode.so console/android/app/src/main/assets/runtime-env/rootfs.tar console/android/app/src/main/assets/runtime-env/manifest.json
          chmod 755 console/android/app/src/main/jniLibs/arm64-v8a/*.so

      - name: 测试 App
        working-directory: console
        run: |
          flutter pub get
          flutter test

      # 步骤级 if 里不能引用 secrets 上下文，先把密钥放进步骤 env，在 shell 里判断。keystore 放在 RUNNER_TEMP（工作区之外），
      # key.properties 用绝对路径指过去；构建一结束（成功或失败）就删掉两者。
      - name: 构建 APK（arm64，正式签名；缺签名 Secrets 直接失败）
        working-directory: console
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::缺少安卓签名 Secrets（ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD），标签发版不允许 debug 签名"
            exit 1
          fi
          KS="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$KS" android/key.properties' EXIT
          umask 077
          printf '%s' "$KS_B64" | base64 -d > "$KS"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS" "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/key.properties
          flutter build apk --release --target-platform android-arm64

      - name: 确认 APK 是正式证书签名（不是 debug）
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs console/build/app/outputs/flutter-apk/app-release.apk | tee "$RUNNER_TEMP/certs.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then echo "::error::APK 是 debug 证书签名的"; exit 1; fi

      - name: 打包资产
        env:
          V: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p out
          cp console/build/app/outputs/flutter-apk/app-release.apk "out/quetzal-$V-android-arm64.apk"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android-arm64
          path: out/quetzal-*-android-arm64.apk
          if-no-files-found: error

  # Linux 桌面版控制台：x64 与 arm64 各一个，在最老的仍受支持的 Ubuntu 上构建（glibc / GTK 越老，能跑的发行版越多）。
  # 龙芯（loongarch64）：Flutter 上游不支持，没有原生控制台；运行基座与网页控制台由安装脚本从 Node 的 unofficial-builds 取 Node 后照常运行。
  linux-console:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Flutter（git clone 官方仓库的版本标签并核对提交；arm64 上 Flutter 没有预打包的 SDK）
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          [ "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT" ] || { echo "Flutter $FLUTTER_VERSION 的提交不符"; exit 1; }
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: 桌面构建依赖
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev
      - name: 构建（console/tool/build-linux.sh → quetzal-<版本>-linux-${{ matrix.arch }}-console.tar.gz）
        run: flutter precache --linux && console/tool/build-linux.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.arch }}
          path: console/build/quetzal-*-linux-*-console.tar.gz
          if-no-files-found: error

  # Windows 安装包：x64 与 arm64 各在原生的 Windows runner 上构建。控制台由 console/tool/build-windows.ps1 打包；运行基座 npm ci + build
  # （dist/main.cjs、windows.mjs、windows-body.mjs、windows-supervise.mjs、srt.mjs、mermaid.mjs；srt-win.exe 取自 sandbox-runtime 包里对应架构的 vendor 目录）；
  # 网状层原生组件按 runtime/tool/mesh-modules.lock.json 的 win32-<架构> 条目核对 sha512 装好；命令行 quetzal.mjs 与网页控制台取自 npm-pack 构建的包
  # （与 Linux 发布的是同一份）；Node.js / Git / Python 与 NSIS 按 cli/windows/deps.lock.json 下载核对；最后 makensis 编译 setup.exe。
  windows:
    needs: [prepare, npm-pack]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    env:
      V: ${{ needs.prepare.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Flutter（git clone 官方仓库的版本标签并核对提交）
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $f = Join-Path $env:RUNNER_TEMP 'flutter'
          git clone --depth 1 --branch $env:FLUTTER_VERSION https://github.com/flutter/flutter.git $f
          if ((git -C $f rev-parse HEAD) -ne $env:FLUTTER_COMMIT) { throw "Flutter $env:FLUTTER_VERSION 的提交不符" }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $f 'bin')
          & (Join-Path $f 'bin/flutter.bat') --version
      - name: 控制台（console/tool/build-windows.ps1 → quetzal-<版本>-windows-<架构>-console.zip）
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          flutter precache --windows
          ./console/tool/build-windows.ps1
          $zip = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'console/build') -Filter "quetzal-$env:V-windows-$env:ARCH-console.zip" | Select-Object -First 1
          if (-not $zip) { throw "没有找到 console/build/quetzal-$env:V-windows-$env:ARCH-console.zip" }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath (Join-Path $env:RUNNER_TEMP 'console')
      - name: 运行基座（npm ci + build）与网状层原生组件（win32-<架构>，核对 sha512）
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Push-Location runtime
          npm ci --no-audit --no-fund
          npm run build
          Pop-Location
          node runtime/tool/install-mesh-modules.mjs runtime/tool/mesh-modules.lock.json (Join-Path $env:RUNNER_TEMP 'mesh') "win32-$env:ARCH" https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tgz
          path: out-npm
      - name: 命令行与网页控制台（取自 npm 包）
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $tgz = Get-ChildItem out-npm -Filter 'plutokeating-quetzal-*.tgz' | Select-Object -First 1
          $d = Join-Path $env:RUNNER_TEMP 'npm'
          New-Item -ItemType Directory -Force $d | Out-Null
          tar -xzf $tgz.FullName -C $d
          if (-not (Test-Path (Join-Path $d 'package/dist/quetzal.mjs'))) { throw 'npm 包里没有 dist/quetzal.mjs' }
          if (-not (Test-Path (Join-Path $d 'package/dist/runtime/web/index.html'))) { throw 'npm 包里没有网页控制台' }
      - name: 下载并核对 Node.js / Git / Python 官方安装包与 NSIS（cli/windows/deps.lock.json）
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # 整个下载脚本最多跑 3 次：下载组件偶尔在进程层面崩溃（不是能被脚本内重试接住的错误）；已核对过的文件不会重新下载
          foreach ($a in @(@($env:ARCH, (Join-Path $env:RUNNER_TEMP 'deps')), @('--tool', 'nsis', (Join-Path $env:RUNNER_TEMP 'tools')))) {
            for ($i = 1; ; $i++) {
              try { node cli/windows/fetch-deps.mjs @a; break } catch { if ($i -ge 3) { throw }; Write-Host "下载失败，第 $i 次重试：$($_.Exception.Message)"; Start-Sleep 10 }
            }
          }
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP 'tools/nsis-3.13.zip') -DestinationPath (Join-Path $env:RUNNER_TEMP 'tools')
      - name: 编译安装包（makensis → out/quetzal-<版本>-windows-<架构>-setup.exe）
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $t = $env:RUNNER_TEMP
          $icon = @()
          if (Test-Path console/windows/runner/resources/app_icon.ico) { $icon = @('--icon', 'console/windows/runner/resources/app_icon.ico') }
          node cli/windows/build-setup.mjs --version $env:V --arch $env:ARCH --runtime runtime/dist `
            --srt-win "runtime/node_modules/@anthropic-ai/sandbox-runtime/vendor/srt-win/$env:ARCH/srt-win.exe" `
            --mesh (Join-Path $t 'mesh') --web (Join-Path $t 'npm/package/dist/runtime/web') --cli (Join-Path $t 'npm/package/dist/quetzal.mjs') `
            --console (Join-Path $t 'console') --deps (Join-Path $t 'deps') --makensis (Join-Path $t 'tools/nsis-3.13/makensis.exe') `
            --stage (Join-Path $t 'stage') --out out @icon
      # 冒烟测试：在这台用完即弃的 runner 上静默安装（runner 以管理员运行，不弹 UAC）、看健康检查、计划任务与状态，再静默卸载。
      # 只作参考，失败不阻断发版：S4U、沙箱这些真机行为以 Windows 实机为准。
      - name: 冒烟测试（静默安装 → 状态 → 卸载）
        continue-on-error: true
        timeout-minutes: 15
        run: |
          $exe = Get-ChildItem out -Filter "quetzal-$env:V-windows-$env:ARCH-setup.exe" | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '/S', '/CLOSEAPPS' -PassThru; $null = $p.Handle; $p.WaitForExit() # -Wait 会连常驻的守护进程一起等
          "setup.exe 退出码 $($p.ExitCode)"
          $root = Join-Path $env:LOCALAPPDATA 'Quetzal'
          Get-Content -LiteralPath (Join-Path $root 'install.log') -ErrorAction SilentlyContinue
          & (Join-Path $root 'bin/quetzal.cmd') status
          Get-Content -LiteralPath (Join-Path $root 'home/logs/runtime.log') -Tail 40 -ErrorAction SilentlyContinue
          $u = Start-Process -FilePath (Join-Path $root 'uninstall.exe') -ArgumentList '/S', '/PURGE' -PassThru; $null = $u.Handle; $u.WaitForExit()
          "uninstall.exe 退出码 $($u.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-${{ matrix.arch }}
          path: out/quetzal-*-windows-*-setup.exe
          if-no-files-found: error

  # 汇总全部资产 → 一份 SHA256SUMS（含提交行）→ Ed25519 签名并用公钥自检 → 构建来源证明 → 创建 Release。只用官方 action 与运行器自带工具。
  release:
    needs: [prepare, build-apk, linux-console, npm-pack, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # 创建 Release、上传资产
      id-token: write        # 构建来源证明（Sigstore）
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: out
          merge-multiple: true

      # Landlock 沙箱启动器 landrun（MIT，github.com/Zouuup/landrun）：按固定版本与 GitHub 给出的 sha256 下载核对，连同许可证打包成
      # quetzal-<版本>-landrun-linux-<架构>.tar.gz 随 Release 发布，纳入下面的签名清单（一键安装脚本在 bubblewrap 用不了的机器上装它）。
      # 升级 landrun：改 LANDRUN_VERSION 与三个 sha256（gh api repos/Zouuup/landrun/releases --jq '.[0].assets[]|.name+" "+.digest'）
      - name: 打包 landrun（Landlock 沙箱启动器）
        env:
          V: ${{ needs.prepare.outputs.version }}
          LANDRUN_VERSION: v0.1.17
          LANDRUN_AMD64_SHA256: 6ada66a06669e8994e174a7271af2db636308e55a0d6ec896cc7d326b46727f6
          LANDRUN_ARM64_SHA256: 365d8c8656c732b14d70e621d972cb733e490621fb5b9c0876376bcf457dbb5d
          LANDRUN_LICENSE_SHA256: f613c30920743111429f7c1cb801f49ccaafe8ae3319b3b0a5f8aca94e5fc082
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/landrun"; mkdir -p "$work"
          curl -fsSL "https://raw.githubusercontent.com/Zouuup/landrun/$LANDRUN_VERSION/LICENSE" -o "$work/LICENSE"
          echo "$LANDRUN_LICENSE_SHA256  $work/LICENSE" | sha256sum -c -
          for pair in amd64:x64:$LANDRUN_AMD64_SHA256 arm64:arm64:$LANDRUN_ARM64_SHA256; do
            IFS=: read -r up ours sum <<<"$pair"
            d="$work/$ours"; mkdir -p "$d"
            curl -fsSL "https://github.com/Zouuup/landrun/releases/download/$LANDRUN_VERSION/landrun-linux-$up" -o "$d/landrun"
            echo "$sum  $d/landrun" | sha256sum -c -
            chmod 755 "$d/landrun"; cp "$work/LICENSE" "$d/LICENSE"
            tar -C "$d" -czf "out/quetzal-$V-landrun-linux-$ours.tar.gz" landrun LICENSE
          done

      - name: 校验值清单 SHA256SUMS（含 commit 行）与签名 SHA256SUMS.sig
        env:
          V: ${{ needs.prepare.outputs.version }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "::error::缺少 Secret RELEASE_SIGNING_KEY（Ed25519 私钥，PKCS8 PEM）"; exit 1; }
          cd out
          for f in "quetzal-$V-android-arm64.apk" "quetzal-$V-linux-x64-console.tar.gz" "quetzal-$V-linux-arm64-console.tar.gz" "quetzal-$V-landrun-linux-x64.tar.gz" "quetzal-$V-landrun-linux-arm64.tar.gz" \
                   "quetzal-$V-windows-x64-setup.exe" "quetzal-$V-windows-arm64-setup.exe"; do
            [ -f "$f" ] || { echo "::error::缺少资产 $f"; exit 1; }
          done
          { sha256sum quetzal-*.apk quetzal-*.tar.gz quetzal-*.exe; printf 'commit %s %s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME"; } > SHA256SUMS
          node -e '
          const c = require("crypto"), f = require("fs");
          const data = f.readFileSync("SHA256SUMS");
          const sig = c.sign(null, data, c.createPrivateKey(process.env.RELEASE_SIGNING_KEY));
          const pub = c.createPublicKey({ key: { kty: "OKP", crv: "Ed25519", x: process.env.RELEASE_PUBKEY }, format: "jwk" });
          if (!c.verify(null, data, pub, sig)) { console.error("签名私钥与 RELEASE_PUBKEY 不是一对"); process.exit(1); }
          f.writeFileSync("SHA256SUMS.sig", sig.toString("base64") + "\n");
          '
          cat SHA256SUMS SHA256SUMS.sig

      - name: 构建来源证明（APK、Linux 控制台、Windows 安装包与 SHA256SUMS）
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/quetzal-*.apk
            out/quetzal-*.tar.gz
            out/quetzal-*.exe
            out/SHA256SUMS

      - name: 提取发布说明（CHANGELOG.md 的对应小节）
        env:
          V: ${{ needs.prepare.outputs.version }}
        run: |
          if [ -f CHANGELOG.md ]; then
            awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > "$RUNNER_TEMP/NOTES.md"
          fi
          [ -s "$RUNNER_TEMP/NOTES.md" ] || : > "$RUNNER_TEMP/NOTES.md"

      # --notes 与 --generate-notes 同时给时，CHANGELOG 小节在前、自动生成的提交摘要在后
      - name: 创建 Release（gh，带全部资产）
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.prepare.outputs.version }}
        run: |
          PRE=(); case "$GITHUB_REF_NAME" in *-*) PRE=(--prerelease);; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Quetzal $V" --notes "$(cat "$RUNNER_TEMP/NOTES.md")" --generate-notes "${PRE[@]}" \
            out/quetzal-*.apk out/quetzal-*.tar.gz out/quetzal-*.exe out/SHA256SUMS out/SHA256SUMS.sig

  # npm 包：Release 成功之后才发布。只下载构建好的 tgz，不检出、不构建；两个 registry 各用一份独立的 npm 用户配置
  # （带作用域的包按 @作用域:registry 决定发到哪、用哪条凭据，--registry 参数不改变凭据查找）。
  publish-npm:
    if: github.event_name == 'push'
    needs: [release, npm-pack]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write        # GitHub Packages
      id-token: write        # npm provenance
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tgz
          path: out-npm
      - name: 发布到 GitHub Packages（仓库的 Packages 栏目；用 GITHUB_TOKEN，总是执行）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '@plutokeating:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$GH_TOKEN" > "$RUNNER_TEMP/npmrc-github"
          TAG=latest; case "$GITHUB_REF_NAME" in *-*) TAG=next;; esac
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc-github" npm publish ./out-npm/plutokeating-quetzal-*.tgz --tag "$TAG"
      - name: 发布到 npmjs.com（有 NPM_TOKEN 时；带 --provenance）
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then echo "没有配置 NPM_TOKEN，跳过 npm 发布"; exit 0; fi
          printf '@plutokeating:registry=https://registry.npmjs.org\n//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/npmrc-npmjs"
          TAG=latest; case "$GITHUB_REF_NAME" in *-*) TAG=next;; esac
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc-npmjs" npm publish ./out-npm/plutokeating-quetzal-*.tgz --access public --provenance --tag "$TAG"
