# 发版：推送 v<版本> 标签 → 测试并构建运行基座、App、Linux 桌面版控制台与 npm 包 → 汇总校验值并签名 → 创建 GitHub Release → 发布 npm 包。
# 资产命名（官网下载页按此识别）：
#   quetzal-<版本>-android-arm64.apk          Quetzal App（内置运行基座与 Termux 身体适配器）
#   quetzal-<版本>-linux-x64-console.tar.gz   Linux 桌面版控制台（原生窗口；一键安装脚本在有桌面的机器上自动下载，见 cli/install.sh）
#   quetzal-<版本>-linux-arm64-console.tar.gz（同上，arm64）
#   SHA256SUMS       上面每个资产一行 `<sha256>  <文件名>`，外加一行 `commit <提交> <标签>`（这个版本对应的源码提交）
#   SHA256SUMS.sig   SHA256SUMS 的 Ed25519 签名（base64）。公钥写死在 App（console/lib/updater.dart）、一键安装脚本（cli/install.sh）
#                    与 soul-bridge（bridge/src）里，官网文档「发布签名与校验」给出校验方法；私钥只在仓库 Secret RELEASE_SIGNING_KEY（PKCS8 PEM）
# 同时把 cli/ 发布为 npm 包 @plutokeating/quetzal（npx @plutokeating/quetzal 安装到 Linux）：GitHub Packages 总是发布；
# npmjs.com 需要仓库 Secret NPM_TOKEN（Granular Access Token），缺少则跳过，发布带 --provenance（npm 页面显示来源证明）。
# 发布说明：CHANGELOG.md 里「## <版本>」小节，后面接 GitHub 自动生成的提交摘要。
#
# 供应链加固：
# - 所有 uses: 都固定到完整的提交 SHA（注释里是对应的标签；升级时用 gh api repos/<owner>/<repo>/git/ref/tags/<标签> 重新解析），
#   而且只用 GitHub 官方的 actions/*：Flutter 直接 git clone 官方仓库的版本标签并核对提交，发 Release 用运行器自带的 gh。
# - 顶层权限只读，每个 job 只拿自己需要的：创建 Release 的 job 才有 contents: write，发布 npm 包的 job 才有 packages: write，
#   两者都有 id-token: write（构建来源证明 / npm provenance），release job 另有 attestations: write。
# - 构建产物经 upload-artifact / download-artifact 在 job 之间传递：签名与发布的 job 不运行任何构建脚本，只核对、签名、上传。
# - 安卓正式签名的 keystore 只出现在 build-apk job 里，flutter build apk 一结束就删除；标签发版缺签名 Secrets 直接失败（不再退回 debug 签名），
#   并用 apksigner 确认 APK 不是 debug 证书签的。需要的 Secrets：ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD。
# - 不用 actions 缓存（标签发版不读取别的分支写入的缓存）。
name: release

on:
  push:
    tags: ["v*"]
  # 试跑：手动触发，按给定版本号走完测试、构建、汇总与签名，但不创建 Release、不发布 npm（新改的发版流程先在这里跑通，免得浪费版本号）
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（与 runtime/package.json 等一致，例如 1.0.3）"
        required: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5
  FLUTTER_COMMIT: 6a19cca56475dbfba1478ee68d7bd0c2ef891da1   # 3.47.5 标签对应的提交；升级 Flutter 时一起更新
  # 发版签名公钥（Ed25519 原始 32 字节的 base64url），签名后用它自检，确认 Secret 里的私钥与各处写死的公钥是一对
  RELEASE_PUBKEY: QbWLzC1yhOWroLTHtHiAAvVWq1UtWDiQP--D9wHaLU8

jobs:
  prepare:
    runs-on: ubuntu-24.04  # 固定版本，避免 ubuntu-latest 迁移提示；升级时同时核对 Flutter / JDK 兼容性
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 校验版本号一致（标签 = runtime/package.json = console/pubspec.yaml = cli/package.json）
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then TAG="$INPUT_VERSION"; else TAG="${GITHUB_REF_NAME#v}"; fi
          RT=$(node -p "require('./runtime/package.json').version")
          APP=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' console/pubspec.yaml)
          CLI=$(node -p "require('./cli/package.json').version")
          echo "tag=$TAG runtime=$RT app=$APP cli=$CLI"
          [ "$TAG" = "$RT" ] && [ "$TAG" = "$APP" ] && [ "$TAG" = "$CLI" ] || { echo "版本号不一致"; exit 1; }
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  # npm 包：内置运行基座、Linux 适配器与网页控制台（cli 的 build 会调用 console/tool/build-web.sh，需要 Flutter）
  npm-pack:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Flutter（git clone 官方仓库的版本标签并核对提交）
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          [ "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT" ] || { echo "Flutter $FLUTTER_VERSION 的提交不符"; exit 1; }
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: 构建 npm 包 @plutokeating/quetzal（npm ci + test + build + pack）
        working-directory: cli
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
          mkdir -p ../out-npm && npm pack --pack-destination ../out-npm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tgz
          path: out-npm/plutokeating-quetzal-*.tgz
          if-no-files-found: error

  build-apk:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - name: Flutter（git clone 官方仓库的版本标签并核对提交）
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          [ "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT" ] || { echo "Flutter $FLUTTER_VERSION 的提交不符"; exit 1; }
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: 构建运行基座并内置进 App（npm ci + test + build）
        run: console/tool/bundle-runtime.sh

      - name: 测试 App
        working-directory: console
        run: |
          flutter pub get
          flutter test

      # 步骤级 if 里不能引用 secrets 上下文，先把密钥放进步骤 env，在 shell 里判断。keystore 放在 RUNNER_TEMP（工作区之外），
      # key.properties 用绝对路径指过去；构建一结束（成功或失败）就删掉两者。
      - name: 构建 APK（arm64，正式签名；缺签名 Secrets 直接失败）
        working-directory: console
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::缺少安卓签名 Secrets（ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD），标签发版不允许 debug 签名"
            exit 1
          fi
          KS="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$KS" android/key.properties' EXIT
          umask 077
          printf '%s' "$KS_B64" | base64 -d > "$KS"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS" "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/key.properties
          flutter build apk --release --target-platform android-arm64

      - name: 确认 APK 是正式证书签名（不是 debug）
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs console/build/app/outputs/flutter-apk/app-release.apk | tee "$RUNNER_TEMP/certs.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then echo "::error::APK 是 debug 证书签名的"; exit 1; fi

      - name: 打包资产
        env:
          V: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p out
          cp console/build/app/outputs/flutter-apk/app-release.apk "out/quetzal-$V-android-arm64.apk"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android-arm64
          path: out/quetzal-*-android-arm64.apk
          if-no-files-found: error

  # Linux 桌面版控制台：x64 与 arm64 各一个，在最老的仍受支持的 Ubuntu 上构建（glibc / GTK 越老，能跑的发行版越多）。
  # 龙芯（loongarch64）：Flutter 上游不支持，没有原生控制台；运行基座与网页控制台由安装脚本从 Node 的 unofficial-builds 取 Node 后照常运行。
  linux-console:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Flutter（git clone 官方仓库的版本标签并核对提交；arm64 上 Flutter 没有预打包的 SDK）
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          [ "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT" ] || { echo "Flutter $FLUTTER_VERSION 的提交不符"; exit 1; }
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: 桌面构建依赖
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: 构建（console/tool/build-linux.sh → quetzal-<版本>-linux-${{ matrix.arch }}-console.tar.gz）
        run: flutter precache --linux && console/tool/build-linux.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.arch }}
          path: console/build/quetzal-*-linux-*-console.tar.gz
          if-no-files-found: error

  # 汇总全部资产 → 一份 SHA256SUMS（含提交行）→ Ed25519 签名并用公钥自检 → 构建来源证明 → 创建 Release。只用官方 action 与运行器自带工具。
  release:
    needs: [prepare, build-apk, linux-console, npm-pack]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # 创建 Release、上传资产
      id-token: write        # 构建来源证明（Sigstore）
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: out
          merge-multiple: true

      - name: 校验值清单 SHA256SUMS（含 commit 行）与签名 SHA256SUMS.sig
        env:
          V: ${{ needs.prepare.outputs.version }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "::error::缺少 Secret RELEASE_SIGNING_KEY（Ed25519 私钥，PKCS8 PEM）"; exit 1; }
          cd out
          for f in "quetzal-$V-android-arm64.apk" "quetzal-$V-linux-x64-console.tar.gz" "quetzal-$V-linux-arm64-console.tar.gz"; do
            [ -f "$f" ] || { echo "::error::缺少资产 $f"; exit 1; }
          done
          { sha256sum quetzal-*.apk quetzal-*.tar.gz; printf 'commit %s %s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME"; } > SHA256SUMS
          node -e '
          const c = require("crypto"), f = require("fs");
          const data = f.readFileSync("SHA256SUMS");
          const sig = c.sign(null, data, c.createPrivateKey(process.env.RELEASE_SIGNING_KEY));
          const pub = c.createPublicKey({ key: { kty: "OKP", crv: "Ed25519", x: process.env.RELEASE_PUBKEY }, format: "jwk" });
          if (!c.verify(null, data, pub, sig)) { console.error("签名私钥与 RELEASE_PUBKEY 不是一对"); process.exit(1); }
          f.writeFileSync("SHA256SUMS.sig", sig.toString("base64") + "\n");
          '
          cat SHA256SUMS SHA256SUMS.sig

      - name: 构建来源证明（APK、Linux 控制台与 SHA256SUMS）
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/quetzal-*.apk
            out/quetzal-*.tar.gz
            out/SHA256SUMS

      - name: 提取发布说明（CHANGELOG.md 的对应小节）
        env:
          V: ${{ needs.prepare.outputs.version }}
        run: |
          if [ -f CHANGELOG.md ]; then
            awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > "$RUNNER_TEMP/NOTES.md"
          fi
          [ -s "$RUNNER_TEMP/NOTES.md" ] || : > "$RUNNER_TEMP/NOTES.md"

      # --notes 与 --generate-notes 同时给时，CHANGELOG 小节在前、自动生成的提交摘要在后
      - name: 创建 Release（gh，带全部资产）
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.prepare.outputs.version }}
        run: |
          PRE=(); case "$GITHUB_REF_NAME" in *-*) PRE=(--prerelease);; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Quetzal $V" --notes "$(cat "$RUNNER_TEMP/NOTES.md")" --generate-notes "${PRE[@]}" \
            out/quetzal-*.apk out/quetzal-*.tar.gz out/SHA256SUMS out/SHA256SUMS.sig

  # npm 包：Release 成功之后才发布。只下载构建好的 tgz，不检出、不构建；两个 registry 各用一份独立的 npm 用户配置
  # （带作用域的包按 @作用域:registry 决定发到哪、用哪条凭据，--registry 参数不改变凭据查找）。
  publish-npm:
    if: github.event_name == 'push'
    needs: [release, npm-pack]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write        # GitHub Packages
      id-token: write        # npm provenance
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tgz
          path: out-npm
      - name: 发布到 GitHub Packages（仓库的 Packages 栏目；用 GITHUB_TOKEN，总是执行）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '@plutokeating:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$GH_TOKEN" > "$RUNNER_TEMP/npmrc-github"
          TAG=latest; case "$GITHUB_REF_NAME" in *-*) TAG=next;; esac
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc-github" npm publish ./out-npm/plutokeating-quetzal-*.tgz --tag "$TAG"
      - name: 发布到 npmjs.com（有 NPM_TOKEN 时；带 --provenance）
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then echo "没有配置 NPM_TOKEN，跳过 npm 发布"; exit 0; fi
          printf '@plutokeating:registry=https://registry.npmjs.org\n//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/npmrc-npmjs"
          TAG=latest; case "$GITHUB_REF_NAME" in *-*) TAG=next;; esac
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc-npmjs" npm publish ./out-npm/plutokeating-quetzal-*.tgz --access public --provenance --tag "$TAG"
