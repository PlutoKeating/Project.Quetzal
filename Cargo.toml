[workspace]
resolver = "3"
members = [
    "crates/quetzalcoatl-types",
    "crates/quetzalcoatl-channels",
    "crates/quetzalcoatl-capabilities",
    "crates/quetzalcoatl-bridge",
    "crates/quetzalcoatl-crypto",
    "crates/quetzalcoatl-spine",
    "crates/quetzalcoatl-domains",
    "crates/quetzalcoatl-ewave",
    "crates/quetzalcoatl-sandbox",
    "crates/quetzalcoatl-kernel",
    "crates/quetzalcoatl-fabric",
    "crates/quetzalcoatl-group",
    "crates/quetzalcoatl-harness",
    "crates/quetzalcoatl-voice-ai",
    "crates/quetzalcoatl-daemon",
    "surfaces/linux",
]

[workspace.package]
version = "2.0.0-alpha.5"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/PlutoKeating/Project.Quetzal"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"

[workspace.dependencies]
argon2 = "0.5.3"
aes = "0.8.4"
base64 = "0.22.1"
blake3 = "1.8.7"
chacha20poly1305 = "0.10.1"
curve25519-dalek = { version = "4.1.3", features = ["digest", "rand_core"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
hkdf = "0.12.4"
hmac = "0.12.1"
iroh = { version = "1.5.0", features = ["unstable-net-report"] }
iroh-mdns-address-lookup = "0.6.1"
iroh-relay = { version = "1.5.0", default-features = false, features = ["tls-ring"] }
ml-kem = { version = "0.2.3", features = ["deterministic", "zeroize"] }
openmls = { version = "=0.8.1", default-features = false }
openmls_memory_storage = { version = "=0.5.0", default-features = false }
openmls_rust_crypto = { version = "=0.5.1", default-features = false }
openmls_traits = { version = "=0.5.0", default-features = false }
quetzalcoatl-capabilities = { version = "2.0.0-alpha.2", path = "crates/quetzalcoatl-capabilities" }
quetzalcoatl-bridge = { version = "2.0.0-alpha.2", path = "crates/quetzalcoatl-bridge" }
quetzalcoatl-channels = { version = "2.0.0-alpha.2", path = "crates/quetzalcoatl-channels" }
quetzalcoatl-crypto = { version = "2.0.0-alpha.2", path = "crates/quetzalcoatl-crypto" }
quetzalcoatl-daemon = { version = "2.0.0-alpha.2", path = "crates/quetzalcoatl-daemon" }
quetzalcoatl-domains = { version = "2.0.0-alpha.2", path = "crates/quetzalcoatl-domains" }
quetzalcoatl-ewave = { version = "2.0.0-alpha.2", path = "crates/quetzalcoatl-ewave" }
quetzalcoatl-fabric = { version = "2.0.0-alpha.2", path = "crates/quetzalcoatl-fabric" }
quetzalcoatl-group = { version = "2.0.0-alpha.2", path = "crates/quetzalcoatl-group" }
quetzalcoatl-harness = { version = "2.0.0-alpha.2", path = "crates/quetzalcoatl-harness" }
quetzalcoatl-kernel = { version = "2.0.0-alpha.2", path = "crates/quetzalcoatl-kernel" }
quetzalcoatl-sandbox = { version = "2.0.0-alpha.2", path = "crates/quetzalcoatl-sandbox" }
quetzalcoatl-spine = { version = "2.0.0-alpha.2", path = "crates/quetzalcoatl-spine" }
quetzalcoatl-types = { version = "2.0.0-alpha.2", path = "crates/quetzalcoatl-types" }
quetzalcoatl-voice-ai = { version = "2.0.0-alpha.2", path = "crates/quetzalcoatl-voice-ai" }
rand_core = { version = "0.6.4", features = ["getrandom"] }
rcgen = "0.14.10"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls-no-provider", "json"] }
rusqlite = { version = "0.38.0", default-features = false, features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.3"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.142", features = ["raw_value"] }
sha2 = "0.10.9"
sha3 = "0.10.9"
thiserror = "2.0.12"
tokio = { version = "1.50.0", default-features = false, features = ["io-util", "net", "rt", "sync", "time"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = { version = "1.9.2", features = ["derive"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = "0.13.5"
