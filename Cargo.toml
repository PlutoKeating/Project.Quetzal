[workspace]
resolver = "3"
members = [
    "crates/quetzalcoatl-types",
]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/PlutoKeating/Project.Quetzal"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
thiserror = "2.0.12"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
