<!doctype html>
<!-- Mermaid 渲染页：由控制台的 MermaidView 加载（mermaid.min.js 为 v11.17.2，MIT 许可，见同目录 LICENSE；已用 esbuild 降级到 chrome88 语法以兼容旧 WebView）。
     四种宿主：安卓 WebView（JavaScript 通道 Out；宿主调用 render()）、Windows 桌面版的 WebView2（chrome.webview.postMessage；宿主调用 render()）、
     Linux 桌面版看不见的 WebKitGTK（消息处理器 out；宿主调用 render(code, dark, false, true) 按图的原始尺寸排版，再整页截图成 PNG）
     与网页版的 iframe（postMessage：收 {id, render, dark, fit}，回 {id, h | error}）。 -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=6">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #c { padding: 4px 0; }
  #c svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
  body.natural #c { display: inline-block; padding: 4px; }
</style>
<script>
  window.onerror = (msg, src, line) => { try { post({ error: "脚本错误：" + msg + " @" + line, ua: navigator.userAgent }); } catch (e) {} };
  let tag = null; // 网页版宿主给这个 iframe 的标识，回报时带上
  const post = (o) => {
    if (tag) o.id = tag;
    const s = JSON.stringify(o);
    if (window.Out) Out.postMessage(s); // 安卓
    else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.out) window.webkit.messageHandlers.out.postMessage(s); // Linux（WebKitGTK）
    else if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(s); // Windows（WebView2）
    else if (window.parent !== window) parent.postMessage(s, "*"); // 网页版
  };
</script>
<script>
  // 旧版 WebView（如 Chromium 88）缺少的 API；mermaid.min.js 已用 esbuild 把语法降到 chrome88
  for (const C of [Array, String, Object.getPrototypeOf(Int8Array)])
    if (!C.prototype.at) Object.defineProperty(C.prototype, "at", { configurable: true, writable: true, value(i) { i = Math.trunc(i) || 0; if (i < 0) i += this.length; return i < 0 || i >= this.length ? undefined : this[i]; } });
  if (!Object.hasOwn) Object.hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  if (!window.structuredClone) window.structuredClone = (v) => v === undefined ? v : JSON.parse(JSON.stringify(v));
</script>
<script src="mermaid.min.js"></script>
</head>
<body>
<div id="c"></div>
<script>
  let n = 0;
  // natural：按图自己的尺寸排版（不随窗口缩放），回报 {h, w}（CSS 像素）；Linux 桌面版据此整页截图
  async function render(code, dark, fit, natural) {
    if (typeof mermaid === "undefined") return post({ error: "mermaid.js 未能加载", ua: navigator.userAgent });
    mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict", fontFamily: "sans-serif" });
    try {
      const { svg } = await mermaid.render("m" + (++n), code);
      const c = document.getElementById("c");
      c.innerHTML = svg;
      const el = c.querySelector("svg");
      if (!fit) el.style.maxWidth = "none";
      if (natural) {
        document.body.classList.add("natural");
        const vb = el.viewBox && el.viewBox.baseVal;
        if (vb && vb.width) { el.setAttribute("width", vb.width); el.setAttribute("height", vb.height); }
        const r = c.getBoundingClientRect();
        setTimeout(() => post({ h: Math.ceil(r.height), w: Math.ceil(r.width) }), 0); // 看不见的页面不一定跑 requestAnimationFrame
        return;
      }
      requestAnimationFrame(() => post({ h: Math.ceil(c.getBoundingClientRect().height) }));
    } catch (e) {
      post({ error: String((e && e.message) || e).slice(0, 300) });
    }
  }
  window.addEventListener("message", (e) => { // 网页版宿主
    let m; try { m = typeof e.data === "string" ? JSON.parse(e.data) : e.data; } catch (err) { return; }
    if (!m || m.render == null) return;
    tag = m.id || tag;
    render(m.render, !!m.dark, m.fit !== false);
  });
  post({ ready: true });
</script>
</body>
</html>
