[package]
name = "quetzalcoatl-uniffi"
description = "Quetzalcoatl V2 三语言（Swift/Kotlin/C#）UniFFI 拉模式流绑定"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
# 绑定生成工具只允许显式 `--features cli` 构建，绝不进入交付给三语言宿主的 cdylib/staticlib。
required-features = ["cli"]

[features]
default = []
cli = ["uniffi/cli", "uniffi/cargo-metadata"]

[dependencies]
quetzalcoatl-client-core = { workspace = true }
thiserror = { workspace = true }
uniffi = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
