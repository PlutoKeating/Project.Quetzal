[package]
name = "quetzalcoatl-wasm"
description = "Quetzalcoatl V2 浏览器端 WASM：OPFS 单写者存储、Web Lock 独占、纯 Rust ruzstd 与纯 WSS 传输"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Cargo 不允许 `lints.workspace = true` 与逐项覆盖共存，因此绑定层手工复刻工作区
# 全部四项 clippy deny，唯一收窄项是 `unsafe_code: forbid -> deny`，以便为 wasm-bindgen/web-sys 宏生成的浏览器胶水
# 放行（精确文件/行见 README 的豁免清单；`workspace_hygiene` 测试强制校验该复刻完整性）。
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
quetzalcoatl-client-core = { workspace = true }
ruzstd = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "Window",
    "WorkerGlobalScope",
    "WorkerNavigator",
    "Navigator",
    "StorageManager",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetFileOptions",
    "FileSystemGetDirectoryOptions",
    "FileSystemWritableFileStream",
    "WritableStream",
    "Blob",
] }

[dev-dependencies]
uuid = { workspace = true }
zstd = { workspace = true }
