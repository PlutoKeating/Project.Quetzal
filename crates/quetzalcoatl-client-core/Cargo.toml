[package]
name = "quetzalcoatl-client-core"
description = "Quetzalcoatl V2 共享客户端核心：单脊柱持有者薄客户端自动切换、三档认知密度差分视图与拉模式 LLM 流桥"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# 防坑规范 #13：本机 `quetzalcoatld` 在线时客户端只允许经本地 IPC 读取/写入；
# 该依赖仅在非 WASM 目标引入，浏览器端（Task 4.2 Web 端）走纯 WSS 中继与 OPFS。
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
quetzalcoatl-daemon = { workspace = true }

[dev-dependencies]
quetzalcoatl-daemon = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
