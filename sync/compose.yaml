# Quetzal 同步服务：三个容器。
#   sync   账户、身体绑定、信令（只在内部网络，经 Caddy 对外；隧道模式下只发布到本机 127.0.0.1，由已有的 Cloudflare Tunnel 等转发，见 compose.tunnel.yaml）
#   caddy  HTTPS 终止与证书自动续期（80 / 443；profile caddy，隧道模式不启动）
#   coturn STUN 与 TURN 中转（3478 + 中转端口段；用宿主网络，Docker 处理大端口段很慢）
# 变量来自同目录的 .env（start.sh 生成，并按 SYNC_FRONT 写好 COMPOSE_FILE 与 COMPOSE_PROFILES，手动运行 docker compose 时也一致）。需要 Docker Compose ≥ 2.23.1（configs.content）。
name: quetzal-sync

services:
  sync:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: quetzal-sync:local
    restart: unless-stopped
    environment:
      SYNC_PUBLIC_URL: https://${SYNC_DOMAIN:?请在 .env 里填写 SYNC_DOMAIN}
      SYNC_WEB_URL: ${SYNC_WEB_URL:-}
      SYNC_TRUST_PROXY: "1"
      SYNC_DATA_DIR: /data
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_OAUTH_RELAY: ${GITHUB_OAUTH_RELAY:-}
      TURN_SECRET: ${TURN_SECRET:?请运行 ./start.sh 生成 TURN_SECRET}
      TURN_HOST: ${TURN_HOST:-}
      SYNC_MAX_AGENTS_PER_USER: ${SYNC_MAX_AGENTS_PER_USER:-20}
      SYNC_MAX_BODIES_PER_AGENT: ${SYNC_MAX_BODIES_PER_AGENT:-16}
    volumes:
      - ./data/sync:/data
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.6-alpine}
    profiles: [caddy]
    restart: unless-stopped
    depends_on: [sync]
    environment:
      SYNC_DOMAIN: ${SYNC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    networks: [internal]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  coturn:
    image: ${COTURN_IMAGE:-coturn/coturn:4.18.0}
    restart: unless-stopped
    network_mode: host
    configs:
      - source: turnserver
        target: /etc/coturn/turnserver.conf
    security_opt: ["no-new-privileges:true"]
    logging: *logging

networks:
  internal: {}

configs:
  # 监听与中转地址都显式指定为主网卡的地址（否则 coturn 会在 Docker 网桥、VPN 等所有网卡上监听，并把它们都当作中转地址）；云服务器的 1:1 NAT 用 external-ip=公网/内网 映射。
  # 加固项参考 Enable Security 的 coturn 安全配置指南：只用有时效的 HMAC 凭据；禁止中转到私有、回环、保留地址（防止借 TURN 打进服务器所在的内网）；
  # 关掉 TCP 中转、软件版本属性与 NAT 行为探测（减少放大攻击的增益）；限制配额与分配时长。4.18 起 CLI、DTLS、RFC 5780 默认关闭。
  turnserver:
    content: |
      listening-port=3478
      listening-ip=${TURN_RELAY_IP:?请运行 ./start.sh 探测 TURN_RELAY_IP}
      no-tls
      realm=${SYNC_DOMAIN}
      fingerprint
      use-auth-secret
      static-auth-secret=${TURN_SECRET}
      min-port=${TURN_MIN_PORT:-49160}
      max-port=${TURN_MAX_PORT:-49250}
      relay-ip=${TURN_RELAY_IP:?请运行 ./start.sh 探测 TURN_RELAY_IP}
      ${TURN_EXTERNAL_IP:+external-ip=${TURN_EXTERNAL_IP}}
      ${TURN_ALLOWED_PEER_IP:+allowed-peer-ip=${TURN_ALLOWED_PEER_IP}}
      user-quota=12
      total-quota=1200
      max-allocate-lifetime=3600
      stale-nonce=600
      unauthorized-ratelimit
      unauthorized-ratelimit-rps=10
      no-tcp-relay
      no-multicast-peers
      no-software-attribute
      log-file=stdout
      simple-log
      denied-peer-ip=0.0.0.0-0.255.255.255
      denied-peer-ip=10.0.0.0-10.255.255.255
      denied-peer-ip=100.64.0.0-100.127.255.255
      denied-peer-ip=127.0.0.0-127.255.255.255
      denied-peer-ip=169.254.0.0-169.254.255.255
      denied-peer-ip=172.16.0.0-172.31.255.255
      denied-peer-ip=192.0.0.0-192.0.0.255
      denied-peer-ip=192.0.2.0-192.0.2.255
      denied-peer-ip=192.88.99.0-192.88.99.255
      denied-peer-ip=192.168.0.0-192.168.255.255
      denied-peer-ip=198.18.0.0-198.19.255.255
      denied-peer-ip=198.51.100.0-198.51.100.255
      denied-peer-ip=203.0.113.0-203.0.113.255
      denied-peer-ip=224.0.0.0-239.255.255.255
      denied-peer-ip=240.0.0.0-255.255.255.255
      denied-peer-ip=::1
      denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
      denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
      denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
      denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
      denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
